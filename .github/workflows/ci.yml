name: Vachaspati platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/openrouter-fallbacks.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: node --check public/widget.js
      - run: node --check worker/server.mjs
